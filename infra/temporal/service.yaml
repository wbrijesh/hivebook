# Internal-only (ClusterIP). The integrations service (Temporal client) and the
# Temporal workers reach the frontend at temporal-frontend:7233 — the default the
# Go client dials (internal/temporal). Never exposed publicly (design-doc 0012).
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: hivebook
  labels:
    app: temporal
spec:
  selector:
    app: temporal
  ports:
    - name: frontend
      port: 7233
      targetPort: frontend
---
# The Temporal Web UI, ClusterIP. Reach it locally via port-forward (just temporal-ui)
# — not behind an IngressRoute, since the dev server has no auth.
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: hivebook
  labels:
    app: temporal
spec:
  selector:
    app: temporal
  ports:
    - name: ui
      port: 8233
      targetPort: ui
