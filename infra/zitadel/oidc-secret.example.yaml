# Reference shape of the OIDC config Secret. `just provision` creates this
# automatically (see docs/auth-setup.adoc); this template is only a manual
# fallback — fill in the values and:
#   kubectl apply -f infra/zitadel/oidc-secret.example.yaml
#
# Consumed by: the web build (WEB_CLIENT_ID, PROJECT_ID, OIDC_ISSUER) and the
# Go API (PROJECT_ID as token audience, OIDC_ISSUER).
apiVersion: v1
kind: Secret
metadata:
  name: trenches-oidc
  namespace: trenches
type: Opaque
stringData:
  OIDC_ISSUER: "https://id.trenches.localhost"
  PROJECT_ID: "REPLACE_WITH_PROJECT_RESOURCE_ID"
  WEB_CLIENT_ID: "REPLACE_WITH_WEB_APP_CLIENT_ID"
  API_CLIENT_ID: "REPLACE_WITH_API_APP_CLIENT_ID"
