# Dedicated Postgres for ZITADEL, deployed separately from the Helm release so
# it is already resolving when ZITADEL's pre-install init hook runs. (The chart's
# bundled subchart is a normal resource that Helm creates only AFTER pre-install
# hooks, so the init job can't reach it — hence our own DB + DSN.)
#
# ZITADEL connects to the `postgres` maintenance database with a superuser and
# creates its own `zitadel` database during init.
#
# The `zitadel-db` Secret (POSTGRES_USER/PASSWORD/DB) is created by the `auth`
# recipe from infra/.env — not committed here.
apiVersion: v1
kind: Service
metadata:
  name: zitadel-db
  namespace: zitadel
spec:
  selector:
    app: zitadel-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zitadel-db
  namespace: zitadel
spec:
  serviceName: zitadel-db
  replicas: 1
  selector:
    matchLabels:
      app: zitadel-db
  template:
    metadata:
      labels:
        app: zitadel-db
    spec:
      # Run as the image's postgres user (uid 70). fsGroup makes the PVC
      # group-writable so initdb needs no root chown.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: zitadel-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
