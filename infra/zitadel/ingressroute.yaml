# Traefik routing for ZITADEL on https://id.hivebook.localhost.
#
# Two routes on one host:
#   - /ui/v2/login  -> the Login V2 container (Next.js, HTTP/1.1)
#   - everything else -> the ZITADEL API/console (gRPC/Connect, needs h2c)
#
# The API backend uses scheme `h2c` so Traefik forwards HTTP/2 cleartext, which
# the console's gRPC traffic requires. TLS is terminated here with the wildcard
# cert minted by cert-manager from the mkcert CA.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zitadel
  namespace: zitadel
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`id.hivebook.localhost`) && PathPrefix(`/ui/v2/login`)
      kind: Rule
      services:
        - name: zitadel-login
          port: 3000
    - match: Host(`id.hivebook.localhost`)
      kind: Rule
      services:
        - name: zitadel
          port: 8080
          scheme: h2c
  tls:
    secretName: hivebook-wildcard-tls
