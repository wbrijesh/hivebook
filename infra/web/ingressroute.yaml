# Web app on https://app.hivebook.localhost.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
  namespace: hivebook
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`app.hivebook.localhost`)
      kind: Rule
      services:
        - name: web
          port: 3000
  tls:
    secretName: hivebook-wildcard-tls
