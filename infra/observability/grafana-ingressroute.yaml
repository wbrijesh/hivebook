# Grafana on https://grafana.hivebook.localhost (admin / password1234 — see infra/.env).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.hivebook.localhost`)
      kind: Rule
      services:
        - name: vm-grafana
          port: 80
  tls:
    secretName: hivebook-wildcard-tls
