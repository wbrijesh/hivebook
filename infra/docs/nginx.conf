server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Antora emits extensionless-friendly .html files; allow /path -> /path.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;

  # Long-cache the fingerprinted UI assets; the bundle path is content-hashed.
  location /_/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
