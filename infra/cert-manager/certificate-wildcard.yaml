# Wildcard leaf cert for *.hivebook.localhost, issued by the mkcert CA.
# One Certificate per namespace that hosts a Traefik IngressRoute, because
# Traefik resolves `tls.secretName` in the same namespace as the route.
# Each issued secret also carries `ca.crt` (the mkcert root) which the Go API
# mounts to trust ZITADEL's TLS when fetching the JWKS in-cluster.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-hivebook
  namespace: zitadel
spec:
  secretName: hivebook-wildcard-tls
  dnsNames:
    - "*.hivebook.localhost"
    - "hivebook.localhost"
  issuerRef:
    name: mkcert-ca
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-hivebook
  namespace: hivebook
spec:
  secretName: hivebook-wildcard-tls
  dnsNames:
    - "*.hivebook.localhost"
    - "hivebook.localhost"
  issuerRef:
    name: mkcert-ca
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-hivebook
  namespace: observability
spec:
  secretName: hivebook-wildcard-tls
  dnsNames:
    - "*.hivebook.localhost"
    - "hivebook.localhost"
  issuerRef:
    name: mkcert-ca
    kind: ClusterIssuer
