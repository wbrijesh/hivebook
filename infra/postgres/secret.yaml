# App database credentials. Matches the TRENCHES_DB_* contract the Go API reads
# in api/internal/database/database.go. Local dev values.
apiVersion: v1
kind: Secret
metadata:
  name: trenches-db
  namespace: trenches
type: Opaque
stringData:
  POSTGRES_DB: trenches
  POSTGRES_USER: trenches
  POSTGRES_PASSWORD: password1234
