# VictoriaMetrics k8s stack — replaces kube-prometheus-stack. Provides the VM
# Operator, vmsingle (storage), vmagent (scraping), Grafana, node-exporter and
# kube-state-metrics. Lighter than Prometheus on the single OrbStack node.

victoria-metrics-operator:
  enabled: true

# Bundled k8s dashboards are handy; keep them. Our custom dashboards are added
# separately as labelled ConfigMaps (see infra/observability/dashboards).
defaultDashboards:
  enabled: true

# No alerting yet — skip rules, alertmanager and vmalert to stay light.
defaultRules:
  enabled: false
alertmanager:
  enabled: false
vmalert:
  enabled: false

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "3d"
    storage:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi

vmagent:
  enabled: true
  spec:
    # Discover VMServiceScrape/VMPodScrape in every namespace (our api/zitadel
    # scrapes live in trenches/observability).
    selectAllByDefault: true

grafana:
  enabled: true
  adminPassword: admin
  # Persist /var/lib/grafana so the VictoriaLogs plugin + datasource survive
  # restarts (otherwise every start re-downloads the plugin, ~slow, and the logs
  # datasource provisioning races the install).
  persistence:
    enabled: true
    type: pvc
    size: 2Gi
    storageClassName: local-path
  # The VictoriaLogs datasource plugin is downloaded at startup; on a slow network
  # that can exceed the default probe window and crash-loop Grafana. Give it room.
  livenessProbe:
    initialDelaySeconds: 60
    failureThreshold: 120
    periodSeconds: 10
    timeoutSeconds: 30
  readinessProbe:
    failureThreshold: 120
    periodSeconds: 10
  # VictoriaLogs datasource plugin so logs are queryable in Grafana.
  plugins:
    - victoriametrics-logs-datasource
  additionalDataSources:
    - name: VictoriaLogs
      # Fixed uid so dashboards can reference it directly (datasource template
      # variables don't auto-resolve for a non-default type on provisioned boards).
      uid: VictoriaLogs
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://victorialogs.observability.svc.cluster.local:9428
      jsonData:
        timeInterval: "5s"
  # Dashboard sidecar discovers ConfigMaps labelled grafana_dashboard=1, and
  # files them into Grafana folders named by the `grafana_folder` annotation
  # (API / Frontend / Auth), each holding a Metrics + Logs dashboard.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
  # We route Grafana through our own Traefik IngressRoute.
  ingress:
    enabled: false
