apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hivebook
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hivebook-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            # DB name/user/password come from the same secret Postgres uses,
            # mapped onto the HIVEBOOK_DB_* names the app reads.
            - name: HIVEBOOK_DB_DATABASE
              valueFrom:
                secretKeyRef: { name: hivebook-db, key: POSTGRES_DB }
            - name: HIVEBOOK_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: hivebook-db, key: POSTGRES_USER }
            - name: HIVEBOOK_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: hivebook-db, key: POSTGRES_PASSWORD }
            # Expected token audience — the ZITADEL project id, which the web app
            # adds to the token aud via the project:id:{id}:aud scope. Optional so
            # the pod starts before Phase 3 provisioning; re-deploy after.
            - name: HIVEBOOK_OIDC_AUDIENCE
              valueFrom:
                secretKeyRef: { name: hivebook-oidc, key: PROJECT_ID, optional: true }
            # Service-account PAT for the ZITADEL management API (the Members
            # surface). Optional so the pod runs before it's provisioned — Members
            # then reports "directory not connected". Synced from infra/.env on
            # `just update api`.
            - name: HIVEBOOK_ZITADEL_MGMT_TOKEN
              valueFrom:
                secretKeyRef: { name: hivebook-oidc, key: MGMT_TOKEN, optional: true }
          volumeMounts:
            - name: oidc-ca
              mountPath: /etc/hivebook/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Readiness gates on the DB (/health → 503 when down); liveness stays on
          # "/" so a transient DB blip doesn't restart an otherwise-healthy pod.
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # Static Go binary — full hardening is free. /tmp is a writable emptyDir
          # since the root filesystem is read-only.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: oidc-ca
          secret:
            secretName: hivebook-wildcard-tls
            items:
              - key: ca.crt
                path: ca.crt
