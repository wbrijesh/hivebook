apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: hivebook
data:
  APP_ENV: "local"
  PORT: "8080"
  HIVEBOOK_DB_HOST: "postgres"
  HIVEBOOK_DB_PORT: "5432"
  HIVEBOOK_DB_SCHEMA: "public"
  # Same issuer string the browser uses; resolved in-cluster via the CoreDNS
  # rewrite to the Traefik service.
  HIVEBOOK_OIDC_ISSUER: "https://id.hivebook.localhost"
  # mkcert CA (ca.crt from the wildcard TLS secret) so the API trusts ZITADEL's
  # TLS when fetching the JWKS.
  HIVEBOOK_OIDC_CA_FILE: "/etc/hivebook/tls/ca.crt"
