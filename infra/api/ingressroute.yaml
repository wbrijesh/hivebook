# Go API on https://api.hivebook.localhost. Plain HTTP/1.1 backend (no h2c).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: hivebook
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.hivebook.localhost`)
      kind: Rule
      services:
        - name: api
          port: 8080
  tls:
    secretName: hivebook-wildcard-tls
