# Go API on https://api.hivebook.localhost. The backend is h2c (HTTP/2 cleartext)
# so the Connect handler's gRPC protocol works end-to-end through the ingress; the
# pod's h2c handler still serves HTTP/1.1 too (Connect, gRPC-Web, kubelet probes).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: hivebook
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.hivebook.localhost`)
      kind: Rule
      services:
        - name: api
          port: 8080
          scheme: h2c
  tls:
    secretName: hivebook-wildcard-tls
