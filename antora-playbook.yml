site:
  title: Hivebook Docs
  url: https://docs.hivebook.localhost
  start_page: hivebook::index.adoc

content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs

asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    # Fetch each diagram's SVG at build time and store it as a site asset,
    # so the served pages never call Kroki at runtime.
    kroki-fetch-diagram: true
    kroki-default-format: svg
    kroki-server-url: https://kroki.io

ui:
  # Vendored, not fetched: the upstream HEAD artifact is rebuilt and expires, so
  # a URL can't pin it. The committed zip makes the build reproducible and
  # network-free. Refresh by re-downloading the antora-ui-default stable bundle.
  bundle:
    url: ./docs/ui-bundle.zip
  supplemental_files: ./docs/supplemental-ui

output:
  dir: ./public

runtime:
  log:
    failure_level: warn
