version: v2
# Go codegen. protovalidate is left out of managed mode so its blank import
# resolves to the canonical module (the same descriptor the runtime validator
# uses) — generating a second local copy would duplicate-register the
# buf/validate extension and panic at init. So: no --include-imports for Go.
managed:
  enabled: true
  disable:
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: api/internal/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: api/internal/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: api/internal/gen
    opt: paths=source_relative
